<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Release Workflow — terminal walkthrough</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: oklch(0.975 0.01 92);
        --paper-2: oklch(0.955 0.014 92);
        --ink: oklch(0.255 0.035 264);
        --ink-2: oklch(0.44 0.03 264);
        --ink-3: oklch(0.6 0.02 264);
        --hair: oklch(0.255 0.035 264 / 0.14);
        --main: oklch(0.34 0.045 264);
        --rc: oklch(0.7 0.155 58);
        --rel: oklch(0.56 0.115 162);
        --feat: oklch(0.55 0.15 268);
        --hot: oklch(0.55 0.21 12);
        --tag: oklch(0.56 0.185 24);
        --term-bg: oklch(0.235 0.028 264);
        --term-bg2: oklch(0.285 0.03 264);
        --term-fg: oklch(0.9 0.015 92);
        --term-dim: oklch(0.66 0.02 264);
        --term-ok: oklch(0.8 0.13 162);
        --term-amber: oklch(0.8 0.13 65);
        --disp: "Bricolage Grotesque", "Georgia", serif;
        --sans: "Instrument Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --ease: cubic-bezier(0.22, 0.61, 0.18, 1);
        --dur: 0.6s;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background:
          radial-gradient(
            120% 80% at 10% -10%,
            var(--paper-2),
            transparent 55%
          ),
          var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        padding: clamp(12px, 2vw, 26px);
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 1.5vh, 16px);
      }

      header.top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
        flex: 0 0 auto;
      }
      .brand .kicker {
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--rc);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
      }
      .brand .kicker::before {
        content: "";
        width: 24px;
        height: 2px;
        background: var(--rc);
      }
      h1 {
        font-family: var(--disp);
        font-weight: 800;
        font-size: clamp(23px, 3.1vw, 38px);
        line-height: 0.98;
        letter-spacing: -0.02em;
        margin: 0;
      }
      h1 em {
        font-style: normal;
        color: var(--rc);
      }
      .brand p {
        margin: 7px 0 0;
        color: var(--ink-2);
        font-size: 13.5px;
        max-width: 52ch;
      }
      .brand p code {
        font-family: var(--mono);
        font-size: 0.88em;
        color: var(--ink);
      }

      .side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }
      .tabs {
        display: inline-flex;
        background: var(--paper-2);
        border: 1px solid var(--hair);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
      }
      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        cursor: pointer;
        font: 700 13px/1 var(--sans);
        color: var(--ink-3);
        padding: 9px 16px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .tab .d {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: red;
        opacity: 0.55;
      }
      .tab.on {
        background: var(--ink);
        color: var(--paper);
      }
      .tab[data-flow="hotfix"].on {
        background: var(--hot);
      }
      .tab[data-flow="normal"] .d {
        color: var(--rc);
      }
      .tab[data-flow="hotfix"] .d {
        color: var(--hot);
      }
      .stepper {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .stepper .sd {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--hair);
        transition:
          background 0.3s var(--ease),
          transform 0.3s var(--ease);
      }
      .stepper .sd.done {
        background: color-mix(in oklch, var(--rc) 55%, var(--paper));
      }
      .stepper .sd.cur {
        background: var(--rc);
        transform: scale(1.5);
      }

      .app {
        border: 1px solid var(--hair);
        border-radius: 16px;
        overflow: hidden;
        background: var(--paper-2);
        box-shadow: 0 24px 60px -40px oklch(0.25 0.04 264 / 0.5);
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--hair);
        background: var(--paper);
        flex: 0 0 auto;
      }
      .lights {
        display: flex;
        gap: 7px;
      }
      .lights i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .lights i:nth-child(1) {
        background: oklch(0.72 0.17 25);
      }
      .lights i:nth-child(2) {
        background: oklch(0.83 0.13 85);
      }
      .lights i:nth-child(3) {
        background: oklch(0.78 0.13 150);
      }
      .titlebar .name {
        font: 600 13px/1 var(--sans);
        color: var(--ink-2);
      }
      .titlebar .ctx {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ctx .on {
        color: var(--ink-3);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 10px;
      }
      .chip {
        padding: 5px 10px;
        border-radius: 999px;
        font: 700 12px/1 var(--mono);
      }
      .chip.main {
        color: var(--paper);
        background: var(--main);
      }
      .chip.rc {
        color: oklch(0.36 0.1 60);
        background: color-mix(in oklch, var(--rc) 34%, var(--paper));
      }
      .chip.rel {
        color: oklch(0.32 0.09 162);
        background: color-mix(in oklch, var(--rel) 30%, var(--paper));
      }

      .panes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1 1 auto;
        min-height: 0;
      }

      .term {
        background: linear-gradient(180deg, var(--term-bg2), var(--term-bg));
        color: var(--term-fg);
        padding: 16px 20px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.68;
        border-right: 1px solid var(--hair);
        overflow: hidden;
        min-height: 0;
      }
      .term .cwd {
        color: var(--term-dim);
        font-size: 11.5px;
        letter-spacing: 0.02em;
        margin-bottom: 10px;
        opacity: 0.9;
      }
      .tline {
        white-space: pre-wrap;
        word-break: break-word;
        opacity: 0;
        transform: translateY(4px);
        animation: lineIn 0.34s var(--ease) forwards;
        animation-delay: calc(var(--i) * 85ms);
      }
      @keyframes lineIn {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .tline .p {
        color: var(--term-amber);
        margin-right: 2px;
      }
      .tline.cmd {
        color: #fff;
        font-weight: 700;
      }
      .tline.out {
        color: var(--term-fg);
      }
      .tline.mut {
        color: var(--term-dim);
      }
      .tline.ok {
        color: var(--term-ok);
      }
      .tline.warn {
        color: var(--term-amber);
      }
      .tline b {
        color: #fff;
        font-weight: 700;
      }
      .caret {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--term-amber);
        vertical-align: -2px;
        margin-left: 3px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .graph {
        background: var(--paper-2);
        position: relative;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .glabel {
        flex: 0 0 auto;
        font: 700 11px/1 var(--mono);
        letter-spacing: 0.08em;
        color: var(--ink-3);
        text-transform: uppercase;
        padding: 12px 18px 4px;
      }
      .swim {
        flex: 1 1 auto;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 16px 6px;
      }
      svg.pipe {
        width: 100%;
        height: auto;
        max-height: 100%;
        display: none;
      }
      svg.pipe.on {
        display: block;
      }

      .detail {
        flex: 0 0 auto;
        max-height: 42%;
        overflow: auto;
        padding: 2px 20px 14px;
        border-top: 1px solid var(--hair);
      }
      .dlabel {
        font: 700 10.5px/1 var(--mono);
        letter-spacing: 0.08em;
        color: var(--ink-3);
        text-transform: uppercase;
        padding: 11px 0 9px;
        position: sticky;
        top: 0;
        background: var(--paper-2);
      }
      .detail ol {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: d;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .detail li {
        counter-increment: d;
        position: relative;
        padding: 3px 8px 3px 38px;
        margin-left: -8px;
        border-radius: 8px;
        font: 500 13px/1.42 var(--sans);
        color: var(--ink-3);
        opacity: 0.32;
        transform: translateY(4px);
        transition:
          opacity 0.35s var(--ease),
          transform 0.35s var(--ease),
          color 0.3s var(--ease),
          background 0.3s var(--ease);
      }
      .detail li.show {
        opacity: 1;
        transform: none;
        color: var(--ink-2);
      }
      .detail li.active {
        background: color-mix(in oklch, var(--ink) 5%, var(--paper));
        color: var(--ink);
      }
      .detail li::before {
        content: counter(d);
        position: absolute;
        left: 8px;
        top: 2px;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: var(--paper);
        border: 1px solid var(--hair);
        font: 700 11px/22px var(--mono);
        text-align: center;
        color: var(--ink-3);
        transition:
          background 0.3s var(--ease),
          color 0.3s var(--ease),
          border-color 0.3s var(--ease),
          transform 0.3s var(--ease);
      }
      .detail li.active::before {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
        transform: scale(1.08);
      }
      .detail li.done::before {
        background: color-mix(in oklch, var(--ink) 14%, var(--paper));
        border-color: transparent;
        color: var(--ink-2);
      }
      .detail li code {
        font-family: var(--mono);
        font-size: 0.88em;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--hair);
        padding: 0 4px;
        border-radius: 4px;
      }
      .detail li b {
        color: var(--ink);
        font-weight: 600;
      }

      .band {
        transition: opacity 0.4s var(--ease);
      }
      .band.feat rect {
        fill: color-mix(in oklch, var(--feat) 11%, var(--paper));
      }
      .band.rc rect {
        fill: color-mix(in oklch, var(--rc) 13%, var(--paper));
      }
      .band.rel rect {
        fill: color-mix(in oklch, var(--rel) 12%, var(--paper));
      }
      .band.main rect {
        fill: color-mix(in oklch, var(--main) 9%, var(--paper));
      }
      .band.hot rect {
        fill: color-mix(in oklch, var(--hot) 11%, var(--paper));
      }
      .lane-label {
        font: 700 17px/1 var(--mono);
      }
      .lane-label.feat {
        fill: oklch(0.48 0.14 268);
      }
      .lane-label.rc {
        fill: oklch(0.5 0.13 58);
      }
      .lane-label.rel {
        fill: oklch(0.42 0.1 162);
      }
      .lane-label.main {
        fill: var(--main);
      }
      .lane-label.hot {
        fill: oklch(0.5 0.19 12);
      }
      .band.rc.gone {
        opacity: 0.3;
      }
      .band.feat.gone {
        opacity: 0.3;
      }

      .edge {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        transition: stroke-dashoffset var(--dur) var(--ease);
      }
      .edge.show {
        stroke-dashoffset: 0;
      }
      .edge.main {
        stroke: var(--main);
      }
      .edge.rc {
        stroke: var(--rc);
      }
      .edge.rel {
        stroke: var(--rel);
      }
      .edge.feat {
        stroke: var(--feat);
      }
      .edge.hot {
        stroke: var(--hot);
      }
      .edge.gone {
        opacity: 0.28;
      }

      .node {
        opacity: 0;
        transition: opacity 0.4s var(--ease);
      }
      .node.show {
        opacity: 1;
      }
      .node circle {
        fill: var(--paper);
        stroke-width: 4;
      }
      .node.main circle {
        stroke: var(--main);
      }
      .node.rc circle {
        stroke: var(--rc);
      }
      .node.rel circle {
        stroke: var(--rel);
      }
      .node.feat circle {
        stroke: var(--feat);
      }
      .node.hot circle {
        stroke: var(--hot);
      }
      .node.gone {
        opacity: 0.35;
      }
      .tagpill rect {
        fill: var(--tag);
      }
      .tagpill text {
        fill: var(--paper);
        font: 700 14px/1 var(--mono);
      }
      .refbox rect {
        fill: color-mix(in oklch, var(--main) 10%, var(--paper));
        stroke: var(--main);
        stroke-width: 1.3;
      }
      .refbox text {
        font: 700 14px/1 var(--mono);
        fill: var(--main);
      }
      .refbox.rc rect {
        fill: color-mix(in oklch, var(--rc) 16%, var(--paper));
        stroke: var(--rc);
      }
      .refbox.rc text {
        fill: oklch(0.44 0.11 60);
      }
      .refbox.rel rect {
        fill: color-mix(in oklch, var(--rel) 14%, var(--paper));
        stroke: var(--rel);
      }
      .refbox.rel text {
        fill: oklch(0.34 0.09 162);
      }
      .refbox.feat rect {
        fill: color-mix(in oklch, var(--feat) 14%, var(--paper));
        stroke: var(--feat);
      }
      .refbox.feat text {
        fill: oklch(0.44 0.15 268);
      }
      .refbox.hot rect {
        fill: color-mix(in oklch, var(--hot) 14%, var(--paper));
        stroke: var(--hot);
      }
      .refbox.hot text {
        fill: oklch(0.47 0.19 12);
      }
      .node.gone .refbox.rc text {
        text-decoration: line-through;
      }

      .rcdel {
        opacity: 0;
        transition: opacity 0.5s var(--ease);
      }
      .rcdel.show {
        opacity: 1;
      }
      .rcdel .strike {
        stroke: var(--hot);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .rcdel .delpill rect {
        fill: var(--hot);
      }
      .rcdel .delpill text {
        fill: var(--paper);
        font: 800 13px/1 var(--mono);
        text-anchor: middle;
      }

      #tok,
      .tok {
        transition: transform var(--dur) var(--ease);
      }
      .tok .ring {
        fill: none;
        stroke: var(--ink);
        stroke-width: 3;
        opacity: 0.85;
      }
      .tok .core {
        fill: var(--ink);
      }
      .tok .pulse {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.5;
        transform-origin: center;
        animation: pulse 1.8s var(--ease) infinite;
      }
      @keyframes pulse {
        0% {
          r: 13;
          opacity: 0.5;
        }
        70%,
        100% {
          r: 26;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tok .pulse {
          animation: none;
          opacity: 0;
        }
      }

      /* traveling callout that rides to the active commit */
      .callout {
        transition:
          transform 0.55s var(--ease),
          opacity 0.35s var(--ease);
      }
      .callout.hide {
        opacity: 0;
      }
      .ctail {
        stroke: var(--ink-3);
        stroke-width: 2;
        stroke-dasharray: 3 3;
        fill: none;
        opacity: 0.7;
      }
      .cbox {
        fill: var(--ink);
      }
      .cbadge {
        fill: var(--rc);
      }
      .pipe[data-flow="hotfix"] .cbadge {
        fill: var(--hot);
      }
      .cnum {
        fill: var(--paper);
        font: 800 14px/1 var(--mono);
        text-anchor: middle;
      }
      .cphrase {
        fill: var(--paper);
        font: 700 15px/1 var(--mono);
      }

      .readout {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      .num {
        font-family: var(--disp);
        font-weight: 800;
        font-size: clamp(24px, 3vw, 36px);
        color: var(--rc);
        line-height: 0.9;
        min-width: 2ch;
      }
      .rtext .h {
        font-family: var(--disp);
        font-weight: 700;
        font-size: clamp(16px, 1.9vw, 19px);
        margin: 1px 0 3px;
        letter-spacing: -0.01em;
      }
      .rtext p {
        margin: 0;
        color: var(--ink-2);
        font-size: clamp(13.5px, 1.5vw, 15.5px);
        max-width: 92ch;
      }
      .rtext p b {
        color: var(--ink);
        font-weight: 600;
      }
      .rtext p code {
        font-family: var(--mono);
        font-size: 0.9em;
        color: var(--ink);
        background: var(--paper-2);
        border: 1px solid var(--hair);
        padding: 1px 5px;
        border-radius: 5px;
      }

      .controls {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--hair);
        background: var(--paper-2);
        color: var(--ink);
        width: 44px;
        height: 44px;
        border-radius: 12px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          transform 0.12s var(--ease),
          border-color 0.2s;
      }
      .btn:hover {
        border-color: var(--ink-3);
      }
      .btn:active {
        transform: translateY(1px) scale(0.97);
      }
      .btn svg {
        width: 17px;
        height: 17px;
        fill: var(--ink);
      }
      .btn.play {
        width: 52px;
        height: 52px;
        background: var(--ink);
        border-color: var(--ink);
      }
      .btn.play svg {
        fill: var(--paper);
        width: 19px;
        height: 19px;
      }
      .track {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: var(--hair);
        position: relative;
        overflow: hidden;
      }
      .track > span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: var(--rc);
        border-radius: 999px;
        transition: width var(--dur) var(--ease);
      }
      .count {
        font: 700 13px/1 var(--mono);
        color: var(--ink-2);
        min-width: 52px;
        text-align: right;
      }

      @media (max-width: 900px) {
        body {
          height: auto;
          overflow: auto;
        }
        .wrap {
          height: auto;
        }
        .panes {
          grid-template-columns: 1fr;
        }
        .term {
          border-right: none;
          border-bottom: 1px solid var(--hair);
        }
        .side {
          align-items: flex-start;
        }
        .app {
          min-height: auto;
        }
        .swim {
          min-height: 280px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001s !important;
          transition-duration: 0.001s !important;
        }
        .edge {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="kicker">Release Workflow</div>
          <h1>Ship a minor, patch a <em>hotfix</em>.</h1>
          <p>
            Two paths to production. Pick a flow and follow the real git
            commands, branch by branch.
          </p>
        </div>
        <div class="side">
          <div class="tabs" id="tabs" role="tablist">
            <button class="tab on" data-flow="normal" role="tab">
              <span class="d"></span>Normal release
            </button>
            <button class="tab" data-flow="hotfix" role="tab">
              <span class="d"></span>Hotfix
            </button>
          </div>

                  "Opens a PR into <code>main</code>; merging it tags <code>v1.1.1</code> and publishes.",
                  "No RC branch, no staging gate — this is the only direct-to-stable path.",
                  "Use it only for small, <b>backward-compatible</b> fixes.",
                ],
              },
            ],
          },
        };

        const DWELL = 4200; // ms each step holds before advancing
        // short phrase shown in the traveling callout, per step
        const LABELS = {
          normal: [
            "baseline",
            "cut RC",
            "feature → rc",
            "fix → rc",
            "promote",
            "merge → tag",
          ],
          hotfix: ["production bug", "hotfix → main", "ship patch"],
        };
        let mode = "normal",
          steps = FLOWS.normal.steps,
          N = steps.length;
        let cur = 0,
          playing = false,
          timer = null;
        let parts = [],
          rcParts = [],
          tok = null,
          rcdel = null,
          dots = [];
        let cout = null,
          ctail = null,
          cbox = null,
          cbadge = null,
          cnum = null,
          cphrase = null,
          vbw = 680,
          vbh = 320;

        const $ = (s) => document.querySelector(s);
        const linesEl = $("#lines"),
          chip = $("#chip"),
          cwd = $("#cwd"),
          glabel = $("#glabel");
        const num = $("#num"),
          rh = $("#rh"),
          rp = $("#rp"),
          count = $("#count"),
          fill = $("#fill"),
          playicon = $("#playicon");
        const stepper = $("#stepper");

        function bindFlow() {
          const svg = document.querySelector(".pipe.on");
          parts = [...svg.querySelectorAll("[data-appear]")];
          rcParts = [...svg.querySelectorAll(".rc, .feat")];
          tok = svg.querySelector(".tok");
          rcdel = svg.querySelector(".rcdel");
          cout = svg.querySelector(".callout");
          ctail = cout.querySelector(".ctail");
          cbox = cout.querySelector(".cbox");
          cbadge = cout.querySelector(".cbadge");
          cnum = cout.querySelector(".cnum");
          cphrase = cout.querySelector(".cphrase");
          const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
          vbw = vb[2];
          vbh = vb[3];
        }
        function buildStepper() {
          stepper.replaceChildren();
          for (let i = 0; i < N; i++) {
            const d = document.createElement("span");
            d.className = "sd";
            stepper.appendChild(d);
          }
          dots = [...stepper.children];
        }

        function termLine(line, i, lastIdx) {
          const div = document.createElement("div");
          div.className = "tline " + line.k;
          div.style.setProperty("--i", i);
          const segs = line.t.split(/(\{b\}|\{\/b\})/);
          let bold = false;
          segs.forEach((seg) => {
            if (seg === "{b}") {
              bold = true;
              return;
            }
            if (seg === "{/b}") {
              bold = false;
              return;
            }
            if (seg === "") return;
            if (line.k === "cmd" && seg.startsWith("$ ")) {
              const p = document.createElement("span");
              p.className = "p";
              p.textContent = "$";
              div.append(p, document.createTextNode(seg.slice(1)));
            } else {
              const s = document.createElement(bold ? "b" : "span");
              s.textContent = seg;
              div.append(s);
            }
          });
          if (i === lastIdx) {
            const c = document.createElement("span");
            c.className = "caret";
            div.append(c);
          }
          return div;
        }

        function parseRich(str) {
          const out = [];
          let i = 0;
          const re = /<(code|b)>(.*?)<\/\1>/g;
          for (const m of str.matchAll(re)) {
            if (m.index > i)
              out.push(document.createTextNode(str.slice(i, m.index)));
            const el = document.createElement(m[1]);
            el.textContent = m[2];
            out.push(el);
            i = m.index + m[0].length;
          }
          if (i < str.length) out.push(document.createTextNode(str.slice(i)));
          return out;
        }

        // Move the traveling callout to sit above the active commit in the
        // reserved top strip, with a leader line pointing down to the node.
        // The group's x-translate follows the node (CSS transition = glide).
        const STRIP_TOP = -50,
          STRIP_H = 34;
        function positionCallout() {
          const [hx, hy] = steps[cur].head;
          const phrase = (LABELS[mode] || [])[cur] || "";
          const pw = 52 + phrase.length * 8.6; // pill width (mono ~15px)
          // centre the pill over the node, then clamp it inside the viewBox
          let lx = -pw / 2;
          lx = Math.max(10 - hx, Math.min(vbw - 10 - pw - hx, lx));

          cout.setAttribute("transform", `translate(${hx},0)`);
          cbox.setAttribute("x", lx);
          cbox.setAttribute("y", STRIP_TOP);
          cbox.setAttribute("width", pw);
          cbox.setAttribute("height", STRIP_H);
          const bcx = lx + 22,
            bcy = STRIP_TOP + STRIP_H / 2;
          cbadge.setAttribute("cx", bcx);
          cbadge.setAttribute("cy", bcy);
          cbadge.setAttribute("r", 12);
          cnum.setAttribute("x", bcx);
          cnum.setAttribute("y", bcy + 5);
          cnum.textContent = cur + 1;
          cphrase.setAttribute("x", lx + 42);
          cphrase.setAttribute("y", bcy + 5);
          cphrase.textContent = phrase;
          // leader from the node (local 0,hy) up to the pill's bottom centre
          ctail.setAttribute(
            "d",
            `M0 ${hy} L ${lx + pw / 2} ${STRIP_TOP + STRIP_H}`,
          );
        }

        function render() {
          const s = steps[cur];
          parts.forEach((p) =>
            p.classList.toggle("show", +p.dataset.appear <= cur),
          );
          const delStep = mode === "normal" ? N - 1 : -1;
          rcParts.forEach((p) =>
            p.classList.toggle("gone", delStep >= 0 && cur >= delStep),
          );
          if (rcdel)
            rcdel.classList.toggle("show", delStep >= 0 && cur >= delStep);
          tok.setAttribute("transform", `translate(${s.head[0]},${s.head[1]})`);
          positionCallout();

          const last = s.term.length - 1;
          linesEl.replaceChildren(
            ...s.term.map((ln, i) => termLine(ln, i, last)),
          );

          chip.className = "chip " + s.chip[0];
          chip.textContent = s.chip[1];
          cwd.textContent = s.cwd;

          num.textContent = String(cur + 1).padStart(2, "0");
          rh.textContent = s.h;
          rp.replaceChildren(...parseRich(s.cap));

          count.textContent = `${cur + 1} / ${N}`;
          fill.style.width = (N === 1 ? 100 : (cur / (N - 1)) * 100) + "%";
          dots.forEach((d, i) => {
            d.classList.toggle("cur", i === cur);
            d.classList.toggle("done", i < cur);
          });
        }

        function setMode(m) {
          if (m === mode) return;
          mode = m;
          steps = FLOWS[m].steps;
          N = steps.length;
          cur = 0;
          document
            .querySelectorAll(".pipe")
            .forEach((el) => el.classList.toggle("on", el.dataset.flow === m));
          document
            .querySelectorAll(".tab")
            .forEach((el) => el.classList.toggle("on", el.dataset.flow === m));
          glabel.textContent = FLOWS[m].label;
          bindFlow();
          buildStepper();
          render();
        }

        function go(i) {
          cur = (i + N) % N;
          render();
        }
        function next() {
          if (cur < N - 1) go(cur + 1);
          else pause();
        }
        function prev() {
          go(cur - 1);
        }
        const IP = "M7 4v16l13-8z",
          IPA = "M6 5h4v14H6zM14 5h4v14h-4z";
        function play() {
          playing = true;
          playicon.setAttribute("d", IPA);
          clearInterval(timer);
          timer = setInterval(() => {
            if (cur >= N - 1) {
              pause();
              return;
            }
            go(cur + 1);
          }, DWELL);
        }
        function pause() {
          playing = false;
          playicon.setAttribute("d", IP);
          clearInterval(timer);
        }
        function toggle() {
          playing ? pause() : cur >= N - 1 ? (go(0), play()) : play();
        }

        $("#play").addEventListener("click", toggle);
        $("#next").addEventListener("click", () => {
          pause();
          next();
        });
        $("#prev").addEventListener("click", () => {
          pause();
          prev();
        });
        $("#restart").addEventListener("click", () => {
          pause();
          go(0);
        });
        document.querySelectorAll(".tab").forEach((t) =>
          t.addEventListener("click", () => {
            pause();
            setMode(t.dataset.flow);
            play();
          }),
        );
        document.addEventListener("keydown", (e) => {
          if (e.key === " ") {
            e.preventDefault();
            toggle();
          } else if (e.key === "ArrowRight") {
            pause();
            next();
          } else if (e.key === "ArrowLeft") {
            pause();
            prev();
          }
        });

        bindFlow();
        buildStepper();
        render();
        setTimeout(() => {
          if (!playing && cur === 0) play();
        }, 1200);
      })();
    </script>
  </body>
</html>
