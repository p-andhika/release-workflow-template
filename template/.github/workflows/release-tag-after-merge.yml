name: Tag Release After Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate and push tag
        id: tag
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(node -e 'const p=require("./package.json"); if(typeof p.version!=="string") process.exit(1); process.stdout.write(p.version)')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid stable package version: $VERSION"
            exit 1
          }
          TAG="v${VERSION}"
          [ "$PR_BRANCH" = "release/${TAG}" ] || {
            echo "Branch ${PR_BRANCH} does not match package version ${VERSION}."
            exit 1
          }
          ! git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "Tag ${TAG} already exists locally."
            exit 1
          }
          [ -z "$(git ls-remote --tags origin "refs/tags/${TAG}")" ] || {
            echo "Tag ${TAG} already exists remotely."
            exit 1
          }
          git tag "$TAG"
          git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Delete RC branch
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          RC_BRANCH="rc/${TAG}-rc.1"
          if [ -n "$(git ls-remote --heads origin "refs/heads/${RC_BRANCH}")" ]; then
            git push origin --delete "${RC_BRANCH}" && echo "Deleted ${RC_BRANCH}" \
              || echo "Could not delete ${RC_BRANCH} (non-fatal)"
          else
            echo "No RC branch ${RC_BRANCH} to delete."
          fi

  publish:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
